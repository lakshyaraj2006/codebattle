{% load static %}
{% if alert_type == "error" or alert_type == "danger" %}
<div id="alert-error-{{ forloop.counter|default:'1' }}" class="flex items-center p-4 mb-4 text-red-800 border border-red-200 rounded-xl bg-red-50 shadow-sm" role="alert">
    <span class="icon icon-alert-error w-4 h-4 text-red-700 shrink-0"></span>
    <div class="ms-3 text-sm font-medium">
        <span class="font-bold">Error:</span> {{ message }}
    </div>
    <button type="button" class="ms-auto -mx-1.5 -my-1.5 bg-red-50 text-red-500 rounded-lg focus:ring-2 focus:ring-red-400 p-1.5 hover:bg-red-200 inline-flex items-center justify-center h-8 w-8" data-dismiss-target="#alert-error-{{ forloop.counter|default:'1' }}" aria-label="Close">
        <span class="sr-only">Close</span>
        <span class="icon icon-close w-3 h-3 text-red-600"></span>
    </button>
</div>
{% elif alert_type == "success" %}
<div id="alert-success-{{ forloop.counter|default:'1' }}" class="flex items-center p-4 mb-4 text-emerald-800 border border-emerald-200 rounded-xl bg-emerald-50 shadow-sm" role="alert">
    <span class="icon icon-alert-success w-4 h-4 text-emerald-700 shrink-0"></span>
    <div class="ms-3 text-sm font-medium">
        <span class="font-bold">Success:</span> {{ message }}
    </div>
    <button type="button" class="ms-auto -mx-1.5 -my-1.5 bg-emerald-50 text-emerald-500 rounded-lg focus:ring-2 focus:ring-emerald-400 p-1.5 hover:bg-emerald-200 inline-flex items-center justify-center h-8 w-8" data-dismiss-target="#alert-success-{{ forloop.counter|default:'1' }}" aria-label="Close">
        <span class="sr-only">Close</span>
        <span class="icon icon-close w-3 h-3 text-emerald-600"></span>
    </button>
</div>
{% elif alert_type == "warning" %}
<div id="alert-warning-{{ forloop.counter|default:'1' }}" class="flex items-center p-4 mb-4 text-amber-800 border border-amber-200 rounded-xl bg-amber-50 shadow-sm" role="alert">
    <span class="icon icon-alert-warning w-4 h-4 text-amber-700 shrink-0"></span>
    <div class="ms-3 text-sm font-medium">
        <span class="font-bold">Warning:</span> {{ message }}
    </div>
    <button type="button" class="ms-auto -mx-1.5 -my-1.5 bg-amber-50 text-amber-500 rounded-lg focus:ring-2 focus:ring-amber-400 p-1.5 hover:bg-amber-200 inline-flex items-center justify-center h-8 w-8" data-dismiss-target="#alert-warning-{{ forloop.counter|default:'1' }}" aria-label="Close">
        <span class="sr-only">Close</span>
        <span class="icon icon-close w-3 h-3 text-amber-600"></span>
    </button>
</div>
{% else %}
<div id="alert-info-{{ forloop.counter|default:'1' }}" class="flex items-center p-4 mb-4 text-blue-800 border border-blue-200 rounded-xl bg-blue-50 shadow-sm" role="alert">
    <span class="icon icon-alert-info w-4 h-4 text-blue-700 shrink-0"></span>
    <div class="ms-3 text-sm font-medium">
        <span class="font-bold">Info:</span> {{ message }}
    </div>
    <button type="button" class="ms-auto -mx-1.5 -my-1.5 bg-blue-50 text-blue-500 rounded-lg focus:ring-2 focus:ring-blue-400 p-1.5 hover:bg-blue-200 inline-flex items-center justify-center h-8 w-8" data-dismiss-target="#alert-info-{{ forloop.counter|default:'1' }}" aria-label="Close">
        <span class="sr-only">Close</span>
        <span class="icon icon-close w-3 h-3 text-blue-600"></span>
    </button>
</div>
{% endif %}
