<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <a class="navbar-brand" href="{% url "home" %}">CodeBattle</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item">
        <a class="nav-link" href="{% url "home" %}">Home <span class="sr-only">(current)</span></a>
      </li>
    </ul>
    <form class="form-inline my-2 my-lg-0 mr-3" action="{% url 'search' %}" method="get">
      <input class="form-control mr-sm-2" type="search" name="q" value="{{ query|default:'' }}" placeholder="Search events, users..." aria-label="Search">
      <button class="btn btn-danger my-2 my-sm-0" type="submit">Search</button>
    </form>
    {% if request.user.is_authenticated %}
    <ul class="navbar-nav">
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle active" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
          <img src="{{request.user.avatar.url}}" alt="{{request.user.username}}" class="rounded-circle mr-2" width="36">
          <span>Welcome - {{request.user.username}}</span>
        </a>
        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdown">
          <a class="dropdown-item" href="{% url "account" %}">Account</a>
          <a class="dropdown-item" href="{% url "logout" %}">Logout</a>
        </div>
      </li>
    </ul>
    {% else %}
    <div>
      <a href="{% url "login" %}" class="btn btn-danger">Login</a>
      <a href="{% url "register" %}" class="btn btn-danger">Register</a>
    </div>
    {% endif %}
  </div>
</nav>
